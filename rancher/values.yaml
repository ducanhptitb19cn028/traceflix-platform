# ============================================================================
# TraceFlix - Rancher GPU Kubernetes values
# ============================================================================
# Set `image.registry` to a registry your cluster can pull from, build & push the
# images (see README), then `helm install traceflix ./rancher -n traceflix --create-namespace`.

# ---- container images for the 9 services + the aiops engine ----------------
image:
  # all service images are pulled as <registry>/<name>:<tag>, e.g.
  #   registry.example.com/traceflix/gateway-service:1.0.0
  registry: registry.example.com/traceflix
  tag: "1.0.0"
  pullPolicy: IfNotPresent
  pullSecrets: []          # for PRIVATE images set [{ name: ghcr-cred }] (see imagePullSecret below)

# ---- pull secret for a PRIVATE registry (e.g. private GHCR packages) --------
# Two ways to use it:
#   A) Create the secret once with kubectl (token never in git), then set
#      image.pullSecrets: [{ name: ghcr-cred }] and leave create=false. See the
#      kubectl command in templates/image-pull-secret.yaml.
#   B) Let the chart create it (create=true) and supply username/password at
#      install time (--set / a local -f file / Fleet helm.valuesFrom secret).
#      NEVER commit a real token. For GHCR the password is a GitHub PAT (classic)
#      with the read:packages scope.
imagePullSecret:
  create: false
  name: ghcr-cred
  registry: ghcr.io
  username: ""             # GitHub username
  password: ""             # GitHub PAT (classic) with read:packages — supply at install, do not commit

# ---- the nine microservices ------------------------------------------------
# k8s Service names MUST equal these names: each service resolves its downstreams
# via in-namespace DNS. The full call graph (the load generator hits the gateway,
# which fans out to the whole mesh) is made EXPLICIT below so the topology is
# visible in the chart and does not depend on each service's baked-in defaults:
#
#   gateway ─┬─► movie ─┬─► actor
#            │          └─► review
#            ├─► user  ─┬─► auth
#            │          └─► recommendation ─► catalog
#            └─► search ─────────────────────► catalog
#
# env keys are the services' *_SERVICE_URL overrides (Spring relaxed binding).
services:
  - name: gateway-service
    image: gateway-service
    env:
      MOVIE_SERVICE_URL:  "http://movie-service:8080"
      USER_SERVICE_URL:   "http://user-service:8080"
      SEARCH_SERVICE_URL: "http://search-service:8080"
  - name: movie-service       # original service: no baked default, MUST get these from env
    image: movie-service
    env:
      ACTOR_SERVICE_URL:  "http://actor-service:8080/api/actors/"
      REVIEW_SERVICE_URL: "http://review-service:8080/api/reviews"
  - name: user-service
    image: user-service
    env:
      AUTH_SERVICE_URL:           "http://auth-service:8080"
      RECOMMENDATION_SERVICE_URL: "http://recommendation-service:8080/api/recommendations"
  - name: search-service
    image: search-service
    env:
      CATALOG_SERVICE_URL: "http://catalog-service:8080"
  - name: recommendation-service
    image: recommendation-service
    env:
      CATALOG_SERVICE_URL: "http://catalog-service:8080"
  # leaf services (no downstreams):
  - { name: actor-service,   image: actor-service }
  - { name: review-service,  image: review-service }
  - { name: auth-service,    image: auth-service }
  - { name: catalog-service, image: catalog-service }

loadGenerator:
  enabled: true
  target: "http://gateway-service:8080/api/browse?userId=1"

# ---- OpenTelemetry java-agent (injected via initContainer) -----------------
otelAgent:
  downloaderImage: curlimages/curl:8.7.1
  url: https://github.com/open-telemetry/opentelemetry-java-instrumentation/releases/latest/download/opentelemetry-javaagent.jar

# ---- observability stack image versions ------------------------------------
telemetry:
  otelCollector:   otel/opentelemetry-collector-contrib:0.110.0
  prometheus:      prom/prometheus:v2.54.1
  victoriametrics: victoriametrics/victoria-metrics:v1.103.0
  loki:            grafana/loki:2.9.8
  tempo:           grafana/tempo:2.5.0
  grafana:         grafana/grafana:11.1.4

grafana:
  adminUser: admin
  adminPassword: change-me-please

# ---- Apache Kafka event backbone (single-node KRaft) -----------------------
kafka:
  enabled: true
  image: bitnami/kafka:3.7

# ---- local LLM (Ollama, GPU) -----------------------------------------------
ollama:
  enabled: true
  image: ollama/ollama:latest
  model: "qwen2.5:3b"       # set to qwen2.5-3b-traceflix after a LoRA export
  pullModel: true           # one-shot Job pulls the model on install
  gpu: true

# ---- AIOps engine + dashboard (GPU) ----------------------------------------
aiops:
  image: traceflix-aiops    # pulled as <registry>/traceflix-aiops:<tag>
  tag: gpu
  gpu: true
  enableLLM: true
  live: false               # dashboard runs synthetic by default; set true to read live telemetry

# ---- GPU scheduling (applies to ollama + aiops) ----------------------------
# With the NVIDIA GPU Operator installed, GPU nodes are usually labelled
# nvidia.com/gpu.present=true and tainted nvidia.com/gpu=present:NoSchedule.
gpu:
  count: 1
  nodeSelector: {}          # e.g. { nvidia.com/gpu.present: "true" }
  tolerations: []           # e.g. [{ key: nvidia.com/gpu, operator: Exists, effect: NoSchedule }]
  runtimeClassName: ""      # e.g. nvidia  (only if your cluster requires it)

# ---- persistent storage ----------------------------------------------------
storage:
  ephemeral: false         # true = use emptyDir instead of PVCs (no StorageClass needed;
                           #        data is lost on pod restart). Fallback for clusters
                           #        with no default StorageClass. See values-virtfusion-emptydir.yaml.
  className: ""             # "" = cluster default (Longhorn / local-path); else e.g. "longhorn"
  prometheus: 10Gi
  victoriametrics: 10Gi
  loki: 10Gi
  tempo: 10Gi
  kafka: 8Gi
  ollama: 20Gi

# ---- ingress (Grafana + the AIOps dashboard) -------------------------------
ingress:
  enabled: true
  className: nginx
  grafanaHost: grafana.traceflix.example.com
  dashboardHost: traceflix.example.com
  tls: false
  tlsSecret: traceflix-tls

# ---- default resource requests (per pod; tune for your nodes) ---------------
resources:
  service:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { cpu: 500m, memory: 512Mi }
