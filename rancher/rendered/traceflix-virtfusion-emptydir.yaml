---
# Source: traceflix/templates/aiops.yaml
# AIOps engine + dashboard (GPU). Serves the React dashboard on :8000; the live
# collectors (TF_LIVE=1) read the in-cluster telemetry, and the k8s-events
# collector lists events in this namespace (RBAC below).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aiops
---
# Source: traceflix/templates/otel-grafana.yaml
# ---- OpenTelemetry Collector ----------------------------------------------
# Mirrors deploy/virtfusion/vm2-services/otel-collector-config.yml, with endpoints
# pointed at the in-cluster Services. Receives OTLP from the java-agents; exports
# traces->Tempo, logs->Loki, metrics->:8889 (scraped by Prometheus).
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
data:
  collector-config.yml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: "0.0.0.0:4317"
          http:
            endpoint: "0.0.0.0:4318"
    processors:
      batch: {}
      resourcedetection:
        detectors: [env, system]
    exporters:
      otlp/tempo:
        endpoint: "tempo:4317"
        tls:
          insecure: true
      loki:
        endpoint: "http://loki:3100/loki/api/v1/push"
      prometheus:
        endpoint: "0.0.0.0:8889"
        resource_to_telemetry_conversion:
          enabled: true
    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [resourcedetection, batch]
          exporters: [otlp/tempo]
        metrics:
          receivers: [otlp]
          processors: [resourcedetection, batch]
          exporters: [prometheus]
        logs:
          receivers: [otlp]
          processors: [resourcedetection, batch]
          exporters: [loki]
---
# Source: traceflix/templates/otel-grafana.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - { name: Prometheus, uid: prometheus_ds, type: prometheus, access: proxy, url: http://prometheus:9090, isDefault: true }
      - { name: VictoriaMetrics, uid: victoriametrics_ds, type: prometheus, access: proxy, url: http://victoriametrics:8428 }
      - { name: Loki, uid: loki_ds, type: loki, access: proxy, url: http://loki:3100 }
      - { name: Tempo, uid: tempo_ds, type: tempo, access: proxy, url: http://tempo:3200 }
---
# Source: traceflix/templates/telemetry-backends.yaml
# ---- Prometheus ------------------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 10s
      evaluation_interval: 10s
    remote_write:
      - url: http://victoriametrics:8428/api/v1/write
    scrape_configs:
      - job_name: otel-collector
        static_configs:
          - targets: ["otel-collector:8889"]
      - job_name: prometheus
        static_configs:
          - targets: ["localhost:9090"]
---
# Source: traceflix/templates/telemetry-backends.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
data:
  loki-config.yaml: |
    auth_enabled: false
    server:
      http_listen_address: 0.0.0.0
      http_listen_port: 3100
    common:
      instance_addr: 127.0.0.1
      path_prefix: /loki
      storage:
        filesystem:
          chunks_directory: /loki/chunks
          rules_directory: /loki/rules
      replication_factor: 1
      ring:
        kvstore:
          store: inmemory
    schema_config:
      configs:
        - from: 2024-01-01
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h
    limits_config:
      retention_period: 24h
      reject_old_samples: false
---
# Source: traceflix/templates/telemetry-backends.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: tempo-config
data:
  tempo.yaml: |
    server:
      http_listen_address: 0.0.0.0
      http_listen_port: 3200
    distributor:
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: "0.0.0.0:4317"
            http:
              endpoint: "0.0.0.0:4318"
    ingester:
      trace_idle_period: 10s
      max_block_bytes: 1048576
      max_block_duration: 5m
    compactor:
      compaction:
        block_retention: 1h
    storage:
      trace:
        backend: local
        local:
          path: /var/tempo/traces
        wal:
          path: /var/tempo/wal
---
# Source: traceflix/templates/aiops.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: aiops-events-reader
rules:
  - apiGroups: [""]
    resources: ["events", "pods"]
    verbs: ["get", "list", "watch"]
---
# Source: traceflix/templates/aiops.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aiops-events-reader
subjects:
  - kind: ServiceAccount
    name: aiops
roleRef:
  kind: Role
  name: aiops-events-reader
  apiGroup: rbac.authorization.k8s.io
---
# Source: traceflix/templates/aiops.yaml
apiVersion: v1
kind: Service
metadata: { name: aiops, labels: { app: aiops } }
spec:
  selector: { app: aiops }
  ports: [{ name: http, port: 8000, targetPort: 8000 }]
---
