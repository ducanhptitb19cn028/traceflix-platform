  labels: { app: aiops }
spec:
  replicas: 1
  selector: { matchLabels: { app: aiops } }
  template:
    metadata: { labels: { app: aiops } }
    spec:
      serviceAccountName: aiops
      containers:
        - name: aiops
          image: "ghcr.io/ducanhptitb19cn028/traceflix-aiops:gpu"
          imagePullPolicy: IfNotPresent
          ports: [{ name: http, containerPort: 8000 }]
          env:
            - { name: PROM_URL, value: "http://prometheus:9090" }
            - { name: VM_URL, value: "http://victoriametrics:8428" }
            - { name: LOKI_URL, value: "http://loki:3100" }
            - { name: TEMPO_URL, value: "http://tempo:3200" }
            - { name: TF_NAMESPACE, value: "default" }
            - { name: TF_LIVE, value: "0" }
            - { name: TF_KAFKA_BOOTSTRAP, value: "kafka:9092" }
