apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-service
  labels:
    app: gateway-service
    app.kubernetes.io/part-of: traceflix
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: traceflix-1.0.0
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway-service
  template:
    metadata:
      labels:
        app: gateway-service
    spec:
      initContainers:
        - name: otel-agent
          image: curlimages/curl:8.7.1
          command: ["sh", "-c"]
          args: ["curl -fsSL -o /otel/opentelemetry-javaagent.jar https://github.com/open-telemetry/opentelemetry-java-instrumentation/releases/latest/download/opentelemetry-javaagent.jar"]
          volumeMounts:
            - { name: otel, mountPath: /otel }
      containers:
        - name: app
          image: "ghcr.io/ducanhptitb19cn028/gateway-service:1.0.0"
          imagePullPolicy: IfNotPresent
          command: ["java"]
          args:
            - "-javaagent:/otel/opentelemetry-javaagent.jar"
            - "-Dotel.service.name=gateway-service"
            - "-Dotel.exporter.otlp.endpoint=http://otel-collector:4317"
            - "-Dotel.exporter.otlp.protocol=grpc"
            - "-Dotel.metrics.exporter=otlp"
            - "-Dotel.logs.exporter=otlp"
            - "-jar"
            - "/app/app.jar"
          env:
            - name: MOVIE_SERVICE_URL
              value: "http://movie-service:8080"
            - name: SEARCH_SERVICE_URL
              value: "http://search-service:8080"
            - name: USER_SERVICE_URL
              value: "http://user-service:8080"
          ports:
            - { name: http, containerPort: 8080 }
          volumeMounts:
            - { name: otel, mountPath: /otel, readOnly: true }
          readinessProbe:
            tcpSocket: { port: 8080 }
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: 8080 }
            initialDelaySeconds: 40
            periodSeconds: 20
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 256Mi
      volumes:
        - { name: otel, emptyDir: {} }
