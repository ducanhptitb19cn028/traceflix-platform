{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: traceflix
  labels:
    {{- include "traceflix.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls }}
  tls:
    - hosts:
        - {{ .Values.ingress.dashboardHost }}
        - {{ .Values.ingress.grafanaHost }}
      secretName: {{ .Values.ingress.tlsSecret }}
  {{- end }}
  rules:
    # AIOps dashboard (FastAPI + React SPA, SSE)
    - host: {{ .Values.ingress.dashboardHost }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: aiops
                port: { number: 8000 }
    # Grafana
    - host: {{ .Values.ingress.grafanaHost }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: grafana
                port: { number: 3000 }
{{- end }}
