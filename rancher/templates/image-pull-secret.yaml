{{/*
  Chart-managed GHCR (or any registry) pull secret, for PRIVATE images.

  Disabled by default (imagePullSecret.create=false). When enabled it builds a
  kubernetes.io/dockerconfigjson secret from imagePullSecret.{registry,username,password}
  and you reference it via image.pullSecrets: [{ name: <imagePullSecret.name> }].

  SECURITY: never commit a real token to git. Supply username/password at install time
  (helm --set, a local -f values file, or a Fleet helm.valuesFrom secret). For GHCR the
  password is a GitHub Personal Access Token (classic) with the read:packages scope.

  Prefer not to template the secret at all? Create it once, out of band, instead:
    kubectl -n traceflix create secret docker-registry ghcr-cred \
      --docker-server=ghcr.io \
      --docker-username=<github-user> \
      --docker-password=<PAT-with-read:packages>
  ...then leave imagePullSecret.create=false and just set image.pullSecrets.
*/}}
{{- if .Values.imagePullSecret.create }}
{{- $r := .Values.imagePullSecret.registry -}}
{{- $u := .Values.imagePullSecret.username -}}
{{- $p := .Values.imagePullSecret.password -}}
{{- if or (not $u) (not $p) }}
{{- fail "imagePullSecret.create=true requires imagePullSecret.username and imagePullSecret.password (supply at install time; do not commit)" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.imagePullSecret.name }}
  labels:
    {{- include "traceflix.labels" . | nindent 4 }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ printf "{\"auths\":{\"%s\":{\"username\":\"%s\",\"password\":\"%s\",\"auth\":\"%s\"}}}" $r $u $p (printf "%s:%s" $u $p | b64enc) | b64enc }}
{{- end }}
