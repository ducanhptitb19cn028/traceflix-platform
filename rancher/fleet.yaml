# Rancher Fleet (Continuous Delivery) config for the TraceFlix Helm chart.
#
# Fleet finds the Helm chart in this directory (Chart.yaml) and installs it with the
# value overrides below. Edit the marked lines for YOUR cluster, commit, push — Fleet
# applies the change automatically. Fleet deploys the images that the
# .github/workflows/images.yml workflow pushes to GHCR; it does not build them.
#
# Wire it up once: Rancher UI -> Continuous Delivery -> Git Repos -> Add Repository
#   Repo URL : https://github.com/ducanhptitb19cn028/traceflix-platform.git
#   Branch   : main
#   Path     : rancher
#   Target   : your GPU cluster / workspace

defaultNamespace: traceflix

helm:
  releaseName: traceflix
  # Wait for resources to be ready before reporting the bundle healthy.
  takeOwnership: true
  timeoutSeconds: 600
  # For chart-managed pull secret (option B): inject the token from a Secret that
  # you create in the cluster's fleet bundle namespace — keeps it out of git.
  #   valuesFrom:
  #     - secretKeyRef:
  #         name: traceflix-ghcr-values   # data key "values.yaml" holds imagePullSecret.{username,password}
  #         key: values.yaml
  values:
    image:
      # ghcr.io/<owner> — must match where the workflow pushes. Lowercase.
      registry: ghcr.io/ducanhptitb19cn028
      tag: "1.0.0"
      pullPolicy: IfNotPresent
      # PRIVATE GHCR packages -> uncomment to reference the pull secret:
      #   pullSecrets: [{ name: ghcr-cred }]
      # Public packages (simplest for a demo) -> leave empty:
      pullSecrets: []

    # ---- pull secret for PRIVATE images --------------------------------------
    # Two ways (see rancher/templates/image-pull-secret.yaml and extras/ghcr-pull-secret.example.yaml):
    #
    # A) RECOMMENDED for Fleet — create the secret once, out of band, so the token
    #    is never in git, then just set image.pullSecrets above:
    #      kubectl -n traceflix create secret docker-registry ghcr-cred \
    #        --docker-server=ghcr.io --docker-username=ducanhptitb19cn028 \
    #        --docker-password=<PAT read:packages>
    #
    # B) Chart-managed — Fleet creates the secret, but the token must be injected
    #    WITHOUT committing it. Set imagePullSecret.create=true here and supply
    #    username/password via a Fleet values secret (helm.valuesFrom below), NOT
    #    inline in this committed file:
    # imagePullSecret:
    #   create: true
    #   name: ghcr-cred
    #   registry: ghcr.io
    #   # username/password come from helm.valuesFrom, never from git.

    aiops:
      tag: gpu

    # ---- EDIT for your cluster ------------------------------------------------
    storage:
      className: ""                 # "" = cluster default; else e.g. "longhorn"

    grafana:
      adminPassword: change-me-please

    ingress:
      enabled: true
      className: nginx
      grafanaHost: grafana.traceflix.example.com
      dashboardHost: traceflix.example.com

    # GPU scheduling — fill from `kubectl get nodes -L nvidia.com/gpu.present`
    # and `kubectl describe node <gpu-node> | grep -i taint`.
    gpu:
      count: 1
      nodeSelector: {}              # e.g. { nvidia.com/gpu.present: "true" }
      tolerations: []               # e.g. [{ key: nvidia.com/gpu, operator: Exists, effect: NoSchedule }]
      runtimeClassName: ""          # e.g. "nvidia" only if your cluster requires it
