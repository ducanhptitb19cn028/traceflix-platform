# Standalone GHCR pull secret for PRIVATE packages — apply this ONCE, out of band.
# The chart then just references it by name (image.pullSecrets: [{ name: ghcr-cred }]).
#
# DO NOT commit a real token. Prefer generating the secret with kubectl so the
# token never lands in a file:
#
#   kubectl create namespace traceflix      # if it doesn't exist yet
#   kubectl -n traceflix create secret docker-registry ghcr-cred \
#     --docker-server=ghcr.io \
#     --docker-username=ducanhptitb19cn028 \
#     --docker-password=<GitHub PAT (classic) with read:packages> \
#     --docker-email=ducanhnt02@gmail.com
#
# This YAML is shown only to illustrate the resulting object. If you must apply it
# as a file, replace the placeholder and keep the file OUT of git.
apiVersion: v1
kind: Secret
metadata:
  name: ghcr-cred
  namespace: traceflix
type: kubernetes.io/dockerconfigjson
data:
  # base64 of: {"auths":{"ghcr.io":{"username":"<user>","password":"<PAT>","auth":"<base64 user:PAT>"}}}
  .dockerconfigjson: <REPLACE-WITH-BASE64-DOCKERCONFIGJSON>
