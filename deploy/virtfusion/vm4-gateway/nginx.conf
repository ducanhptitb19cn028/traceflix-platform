# nginx reverse proxy (rendered from env by the nginx image's envsubst at boot).
# /          -> AIOps dashboard on VM1 (FastAPI + React SPA, with SSE streaming)
# /grafana/  -> Grafana (sub-path)
# Public surface is TLS + basic-auth; everything else stays on the WG mesh.

# basic-auth file is generated from $DASHBOARD_BASIC_AUTH at container start
# (see the command note in README §8); referenced here as /etc/nginx/.htpasswd.

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    auth_basic           "TraceFlix";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # AIOps dashboard (VM1). SSE endpoints need buffering off + long read timeout.
    location / {
        proxy_pass http://${VM1_GPU_IP}:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_buffering off;            # required for /api/online/stream + /api/offline/run (SSE)
        proxy_read_timeout 3600s;
    }

    location /grafana/ {
        proxy_pass http://grafana:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
