# Prometheus on VM3. Scrapes the OTel collector's Prometheus exporter on VM2
# (java-agent JVM/HTTP metrics) and remote_writes everything to VictoriaMetrics
# for the C4 long-range baseline. Mirrors on-demand-observability.yaml.
global:
  scrape_interval: 10s
  evaluation_interval: 10s

remote_write:
  - url: http://victoriametrics:8428/api/v1/write

scrape_configs:
  - job_name: otel-collector
    static_configs:
      # ${VM2_SVC_IP} substituted at deploy time (see README §5) — collector exporter.
      - targets: ["__VM2_SVC_IP__:8889"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
