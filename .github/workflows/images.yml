name: Build & push images (GHCR)

# Builds the ten TraceFlix images (nine Java microservices + the AIOps engine)
# and pushes them to GitHub Container Registry, so Rancher Fleet can deploy them.
#
# Images land at:
#   ghcr.io/<owner>/<service>-service:<tag>   (e.g. ghcr.io/ducanhptitb19cn028/gateway-service:1.0.0)
#   ghcr.io/<owner>/traceflix-aiops:gpu
#
# Triggered on pushes to main and on version tags; also runnable on demand.
on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'services/**'
      - 'aiops/**'
      - 'rancher/aiops.Dockerfile'
      - '.github/workflows/images.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # ghcr.io/<owner> — owner is taken automatically from the repo, lowercased by GHCR.
  TAG: "1.0.0"        # service image tag (matches rancher/values.yaml image.tag)
  AIOPS_TAG: "gpu"    # aiops image tag (matches rancher/values.yaml aiops.tag)

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write     # required to push to GHCR

jobs:
  # --- nine Java microservices ---------------------------------------------
  services:
    name: Java services -> GHCR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build all service jars
        run: mvn -f services/pom.xml clean package -DskipTests

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push the nine service images
        run: |
          REG="${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}"   # lowercase owner
          for s in movie actor review gateway user search recommendation auth catalog; do
            img="$REG/$s-service:$TAG"
            echo "==> $img"
            docker build -t "$img" "services/$s-service"
            docker push "$img"
          done

  # --- AIOps engine + dashboard --------------------------------------------
  aiops:
    name: AIOps -> GHCR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push the aiops image
        run: |
          REG="${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}"
          img="$REG/traceflix-aiops:$AIOPS_TAG"
          echo "==> $img"
          docker build -f rancher/aiops.Dockerfile -t "$img" .
          docker push "$img"
