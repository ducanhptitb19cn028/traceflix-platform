name: CI

# Build + test the whole project by driving the root Makefile.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # --- Java microservices: mvn package + unit/controller tests -------------
  services:
    name: Java services (build + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build services
        run: make build-services

      - name: Test services (Mockito + @WebMvcTest)
        run: make test-services

  # --- aiops: invariants + an experiment smoke through the Makefile --------
  aiops:
    name: aiops (tests + experiment smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: aiops/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # CPU-only torch first so `make setup` doesn't pull the large CUDA build
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          make setup
          pip install pytest

      - name: aiops invariants
        run: make test-aiops

      - name: Experiment smoke (RQ1-RQ4 + RQ3 + cost + figures)
        run: make quick          # EPISODES=60 DRIFT_EPISODES=120

      - name: Streaming backbone smoke
        run: make streaming STREAM_EPISODES=10

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: experiment-results
          path: aiops/data/results/
          if-no-files-found: ignore
